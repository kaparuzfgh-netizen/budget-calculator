name = "budget-companion-api"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = true

# ── D1 ─────────────────────────────────────────────────────────
# Владелец создаёт БД один раз: `wrangler d1 create budget-companion`
# и вписывает сюда выданный database_id (см. docs/v2-development.md).
[[d1_databases]]
binding = "DB"
database_name = "budget-companion"
database_id = "d886f0a1-de15-4880-a8be-dfff4a0a1c34"
migrations_dir = "migrations"

# ── Статика Mini App (Workers Static Assets, шаг 5) ────────────
# SPA на Vite из apps/web → dist. Ассеты проверяются первыми; /api/*,
# /telegram/* и /health всегда идут в воркер (иначе SPA-fallback
# перехватил бы, например, GET /health в браузере → index.html).
[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/telegram/*", "/health"]

# ── Несекретные переменные ──────────────────────────────────────
# Username бота без @ — для ссылок-приглашений https://t.me/<bot>?start=<code>.
# MINI_APP_URL — адрес Mini App, на него указывает menu-button «💰 Бюджет»
# у поля ввода (setChatMenuButton; ставится в scripts/setup.mjs, вручную —
# node scripts/telegram-webhook.mjs menu <url>).
[vars]
TELEGRAM_BOT_USERNAME = "Helper_6666_bot"
MINI_APP_URL = "https://budget-companion-api.fool-undef.workers.dev"

# ── Cron-триггеры (шаг 4 миграции: напоминания, валютные алерты) ─
[triggers]
# напоминания: каждый час UTC — дальше фильтр по локальному времени пользователя
crons = ["0 * * * *"]

# ── Секреты (НЕ в этом файле!) ──────────────────────────────────
# Задаются через `wrangler secret put <NAME>` (и в CI через
# CLOUDFLARE_* секреты GitHub):
#   TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, JWT_SECRET,
#   OWNER_TELEGRAM_ID, DATA_KEY

# ── Стейджинг (wrangler env) ────────────────────────────────────
# Отдельный воркер + D1 + секреты; бот — ОТДЕЛЬНЫЙ тестовый (у
# Telegram один webhook на бота, продовым пользоваться нельзя).
# Первичная настройка: `npm run setup:staging` (токен тест-бота из
# @BotFather, секреты и DATA_KEY генерируются заново), дальнейшие
# деплои — `npm run release:staging`.
# ВАЖНО: блок env остаётся последним в файле — envSection() в
# scripts/setup-utils.mjs режет по следующему top-level заголовку.
[env.staging]
name = "budget-companion-api-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "budget-companion-staging"
database_id = "5ddf32aa-bad1-4435-9197-6d3722378f6d"
migrations_dir = "migrations"

# cron на стейджинге выключен — напоминания шлёт только прод
[env.staging.triggers]
crons = []

[env.staging.vars]
TELEGRAM_BOT_USERNAME = "PENDING_SETUP_STAGING_BOT" # заменит npm run setup:staging
MINI_APP_URL = "https://budget-companion-api-staging.fool-undef.workers.dev"
