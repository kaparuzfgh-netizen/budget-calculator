name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps-script/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: clasp push → version → deployment
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      # secrets.* недоступны в if на уровне job — проверяем здесь и пропускаем
      # остальные шаги, пока владелец не настроил секреты (SETUP.md, «CI/CD»).
      - name: Проверка секретов деплоя
        id: cfg
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ] || [ -z "$CLASP_JSON" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты CLASPRC_JSON/CLASP_JSON не заданы — деплой пропущен. Как настроить: SETUP.md, раздел CI/CD."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js (.nvmrc)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Учётные данные clasp
        if: steps.cfg.outputs.configured == 'true'
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: |
          umask 077
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > .clasp.json
          printf '{\n  "deploymentId": "%s"\n}\n' "$DEPLOYMENT_ID" > .deploy.json

      - name: npm ci
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci

      - name: Deploy (check → push → version → deployment → URL)
        if: steps.cfg.outputs.configured == 'true'
        run: npm run deploy
