name: Deploy Mini App (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'mini-app/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Подставить WEBAPP_URL → Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js (.nvmrc)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Сборка _site (подстановка URL веб-приложения в копию index.html)
        env:
          WEBAPP_URL: ${{ vars.WEBAPP_URL }}
        run: |
          node -e '
            const fs = require("fs");
            const url = (process.env.WEBAPP_URL || "").trim();
            if (!url) {
              console.error("::error::Переменная репозитория WEBAPP_URL не задана. " +
                "Settings → Secrets and variables → Actions → Variables → WEBAPP_URL = " +
                "URL веб-приложения Apps Script (…/macros/s/<id>/exec). См. SETUP.md.");
              process.exit(1);
            }
            fs.mkdirSync("_site", { recursive: true });
            const html = fs.readFileSync("mini-app/index.html", "utf8")
              .split("REPLACE_WITH_WEBAPP_URL").join(url);
            fs.writeFileSync("_site/index.html", html);
            console.log("✅ _site/index.html собран (API_URL → " + url + ")");
          '

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
