name: Deploy v2 (Cloudflare)

on:
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - '.github/workflows/deploy-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-v2
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  deploy:
    name: сборка web → миграции D1 → wrangler deploy
    needs: ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      # secrets.* недоступны в if на уровне job — проверяем здесь и пропускаем
      # остальные шаги, пока владелец не настроил секреты (docs/v2-development.md).
      - name: Проверка секретов деплоя
        id: cfg
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Секреты CLOUDFLARE_API_TOKEN/CLOUDFLARE_ACCOUNT_ID не заданы — деплой пропущен. Как настроить: docs/v2-development.md, раздел «Деплой»."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Node.js (.nvmrc)
        if: steps.cfg.outputs.configured == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm ci
        if: steps.cfg.outputs.configured == 'true'
        run: npm ci

      # Mini App отдаётся как [assets] того же воркера — собирать ДО deploy.
      - name: Сборка Mini App
        if: steps.cfg.outputs.configured == 'true'
        run: npm run build -w apps/web

      - name: Миграции D1 (remote)
        if: steps.cfg.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: d1 migrations apply DB --remote

      - name: Deploy API (Worker)
        if: steps.cfg.outputs.configured == 'true'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/api
          command: deploy


